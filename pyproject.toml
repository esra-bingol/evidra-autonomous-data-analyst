[project]
name = "evidra"
version = "0.2.0"
description = "Evidra analysis engine (Phase 2)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "plotly>=5.18",
    "openpyxl>=3.1",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["analysis*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
